<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание магистратуры ИСАУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12141c; --surface:#1b1e2a; --surface-2:#242838; --line:#2c3144;
  --text:#eceef6; --muted:#8a8fa6; --faint:#555b72;
  --accent:#6f78f2; --accent-soft:#a6acf7; --lec:#b07cf5; --pr:#5b8cf7;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f4fa; --surface:#ffffff; --surface-2:#eceefa; --line:#dfe2ee;
  --text:#171a26; --muted:#62677d; --faint:#a3a8bb;
  --accent:#5560e6; --accent-soft:#c9ccfa; --lec:#8a4fe0; --pr:#3a6fe8; color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4fa; --surface:#ffffff; --surface-2:#eceefa; --line:#dfe2ee;
    --text:#171a26; --muted:#62677d; --faint:#a3a8bb;
    --accent:#5560e6; --accent-soft:#c9ccfa; --lec:#8a4fe0; --pr:#3a6fe8; color-scheme:light;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.app{max-width:520px;margin:0 auto;padding:12px 16px 40px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px 18px}
.top h1{font-size:1.6rem;font-weight:700;margin:0;letter-spacing:-.01em}
.group-pill{display:flex;flex-direction:column;align-items:flex-end;text-align:right;padding:8px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);max-width:60%}
.group-pill b{font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.group-pill span{font-size:.75rem;color:var(--muted)}

.nav{display:grid;grid-template-columns:40px 1fr auto 40px;align-items:center;gap:6px;margin-bottom:14px}
.arrow{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--accent)}
.arrow:disabled{color:var(--faint);cursor:default}
.arrow svg{width:22px;height:22px}
.period{line-height:1.3}
.period .m{font-weight:600}
.period .w{font-size:.9rem;color:var(--muted)}
.mode{padding:7px 16px;border:1.5px solid var(--accent);border-radius:999px;color:var(--accent-soft);font-weight:600;font-size:.95rem}

.strip{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:22px}
.strip .dn{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.strip>div{display:flex;flex-direction:column;align-items:center}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:0;width:100%}
.day .num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.15rem;font-weight:500;transition:background .15s}
.day.today .num{background:var(--accent-soft);color:#141735}
.day.sel .num{background:var(--accent);color:#fff}
.day.off{opacity:.3;cursor:default}
.dots{display:flex;justify-content:center;gap:3px;height:7px;width:100%}
.dots i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--pr)}
.dots i.l{background:var(--lec)}

.slots{display:flex;flex-direction:column;gap:12px;touch-action:pan-y}
.slot{display:grid;grid-template-columns:58px 1fr;gap:14px;padding:16px 18px;border-radius:18px;background:var(--surface)}
.slot.empty{opacity:.5;padding:14px 18px}
.time{font-size:.95rem;color:var(--muted);line-height:1.55;font-variant-numeric:tabular-nums;font-weight:500}
.dash{display:flex;flex-direction:column;justify-content:space-around;height:100%}
.dash i{display:block;width:44px;height:1.5px;background:var(--faint)}
.lesson+.lesson{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.subj{font-size:1.1rem;font-weight:600;line-height:1.3}
.subj .room{font-weight:600}
.teacher{color:var(--muted);margin-top:6px}
.meta{font-size:.8rem;color:var(--muted);margin-top:6px}
.tag{flex:none;padding:4px 11px;border-radius:999px;font-size:.8rem;font-weight:600;color:#fff}
.tag.l{background:var(--lec)}
.tag.p{background:var(--pr)}
.subj .abbr{color:var(--muted);font-weight:500}
.room-line{margin-top:6px;font-size:.95rem}
.room-line b{font-weight:600}

.weekday-h{font-weight:600;margin:18px 4px 2px;display:flex;justify-content:space-between}
.weekday-h span{color:var(--muted);font-weight:400;font-size:.9rem}
.weekday-h:first-child{margin-top:0}

.notice{padding:28px 20px;border-radius:18px;background:var(--surface);text-align:center;color:var(--muted);line-height:1.5}
.notice b{display:block;color:var(--text);font-size:1.1rem;margin-bottom:4px}


/* выбор группы */
.sheet-bg{position:fixed;inset:0;background:rgba(5,6,12,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:88%;display:flex;flex-direction:column;animation:up .22s ease-out}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 16px;font-size:1.25rem}
.lbl{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:5px;border-radius:14px;margin-bottom:18px}
.seg button{padding:11px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.search{position:relative}
.search input{width:100%;padding:14px 44px 14px 16px;font:inherit;font-size:1rem;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:14px}
.search input:focus{outline:none;border-color:var(--accent)}
.search .chev{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.list{list-style:none;margin:8px 0 0;padding:4px;background:var(--bg);border-radius:14px;overflow:auto;max-height:280px}
.list li{padding:12px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.list li span{color:var(--muted);font-size:.85rem;white-space:nowrap}
.list li small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.list li.act,.list li:hover{background:var(--surface-2)}
.list .none{color:var(--muted);cursor:default}
.list .none:hover{background:none}
.go{margin-top:16px;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:1rem}
.go:disabled{opacity:.4;cursor:default}
.err{color:#f08a8a;font-size:.85rem;margin-top:8px;min-height:1.2em}
mark{background:none;color:var(--accent-soft);font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Расписание</h1>
    <button class="group-pill" id="groupBtn" aria-label="Сменить группу"><b id="groupName">Выберите группу</b><span id="groupCourse">магистратура ИСАУ</span></button>
  </header>

  <div class="nav">
    <button class="arrow" id="prev" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="period"><div class="m" id="monthLbl"></div><div class="w" id="weekLbl"></div></div>
    <button class="mode" id="modeBtn">Неделя</button>
    <button class="arrow" id="next" aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <div class="strip" id="strip"></div>
  <main class="slots" id="slots"></main>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Группа</h2>
    <p class="lbl">Курс магистратуры</p>
    <div class="seg" id="courseSeg">
      <button data-c="1" aria-pressed="true">1 курс</button>
      <button data-c="2" aria-pressed="false">2 курс</button>
    </div>
    <p class="lbl">Номер или аббревиатура группы</p>
    <div class="search">
      <input id="q" type="text" autocomplete="off" placeholder="Например, 5071 или ПИ" role="combobox" aria-expanded="true" aria-controls="list">
      <button class="chev" id="chev" aria-label="Показать все группы"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <ul class="list" id="list" role="listbox"></ul>
    <div class="err" id="err"></div>
    <button class="go" id="go" disabled>Показать расписание</button>
  </div>
</div>

: false, "teacher": "Белов М.А.", "note": null, "until": null, "day": 5, "pair": 2, "type": "pr"}, {"guess": true, "week": "odd", "subject": "Цифровые двойники территорий", "short": "ЦДТ", "room": "1-307", "online": false, "teacher": "Горюнова Е.А.", "note": null, "until": null, "day": 5, "pair": 3, "type": "pr"}, {"guess": true, "week": "even", "subject": "Системы интеллектуального анализа данных", "short": "СИАД", "room": "1-307", "online": false, "teacher": "Добрынин Д.В.", "note": null, "until": null, "day": 5, "pair": 3, "type": "pr"}, {"guess": true, "week": "even", "subject": "Системы интеллектуального анализа данных", "short": "СИАД", "room": "1-307", "online": false, "teacher": "Добрынин Д.В.", "note": null, "until": null, "day": 5, "pair": 4, "type": "pr"}], "profile": "Цифровые двойники в пространственно-распределённых системах"}, "6031 Экономика (УИПвЦЭ)": {"course": 2, "lessons": [{"guess": false, "week": "even", "subject": "ИПФиПИР", "short": null, "room": null, "online": true, "teacher": "Халимендик В.Б.", "note": null, "until": null, "day": 0, "pair": 6, "type": "pr"}, {"guess": true, "week": "all", "subject": "Управление инновационными проектами", "short": "УИП", "room": null, "online": true, "teacher": "Орлова Е.Р.", "note": null, "until": null, "day": 1, "pair": 5, "type": "lec"}, {"guess": true, "week": "odd", "subject": "Информационные технологии в цифровой экономике", "short": "ИТвЦЭ", "room": null, "online": true, "teacher": "Тюпикова Т.В.", "note": null, "until": null, "day": 1, "pair": 6, "type": "lec"}, {"guess": true, "week": "even", "subject": "Информационные технологии в цифровой экономике", "short": "ИТвЦЭ", "room": null, "online": true, "teacher": "Тюпикова Т.В.", "note": null, "until": null, "day": 1, "pair": 6, "type": "pr"}, {"guess": false, "week": "all", "subject": "И-М", "short": null, "room": null, "online": true, "teacher": "Мельник Е.П.", "note": null, "until": null, "day": 2, "pair": 5, "type": "pr"}, {"guess": false, "week": "all", "subject": "Научно-исследовательская работа", "short": "НИР", "room": null, "online": true, "teacher": "Панов С.А.", "note": null, "until": null, "day": 2, "pair": 6, "type": "pr"}, {"guess": false, "week": "all", "subject": "И-М", "short": null, "room": "1-219", "online": false, "teacher": "Мельник Е.П.", "note": null, "until": null, "day": 3, "pair": 3, "type": "pr"}, {"guess": false, "week": "all", "subject": "ПБ-П", "short": null, "room": "1-211", "online": false, "teacher": "Шокин Я.В.", "note": null, "until": null, "day": 3, "pair": 4, "type": "pr"}, {"guess": false, "week": "all", "subject": "ПБ-П", "short": null, "room": "1-211", "online": false, "teacher": "Шокин Я.В.", "note": null, "until": null, "day": 3, "pair": 5, "type": "pr"}, {"guess": false, "week": "all", "subject": "ИПФиПИР", "short": null, "room": "1-424", "online": false, "teacher": "Халимендик В.Б.", "note": null, "until": null, "day": 3, "pair": 6, "type": "pr"}, {"guess": false, "week": "even", "subject": "ПкИРР", "short": null, "room": "1-210", "online": false, "teacher": "Рогов М.А.", "note": null, "until": null, "day": 4, "pair": 3, "type": "lec"}, {"guess": true, "week": "odd", "subject": "Информационные технологии в цифровой экономике", "short": "ИТвЦЭ", "room": "4-222", "online": false, "teacher": "Тюпикова Т.В.", "note": null, "until": null, "day": 4, "pair": 4, "type": "pr"}, {"guess": false, "week": "even", "subject": "ПкИРР", "short": null, "room": "1-429", "online": false, "teacher": "Рогов М.А.", "note": null, "until": null, "day": 4, "pair": 4, "type": "lec"}, {"guess": true, "week": "odd", "subject": "Информационные технологии в цифровой экономике", "short": "ИТвЦЭ", "room": "4-222", "online": false, "teacher": "Тюпикова Т.В.", "note": null, "until": null, "day": 4, "pair": 5, "type": "pr"}, {"guess": false, "week": "even", "subject": "ПкИРР", "short": null, "room": "1-429", "online": false, "teacher": "Рогов М.А.", "note": null, "until": null, "day": 4, "pair": 5, "type": "pr"}, {"guess": false, "week": "even", "subject": "ПкИРР", "short": null, "room": "1-429", "online": false, "teacher": "Рогов М.А.", "note": null, "until": null, "day": 4, "pair": 6, "type": "pr"}, {"guess": true, "week": "even", "subject": "Управление инновационными проектами", "short": "УИП", "room": "1-429", "online": false, "teacher": "Орлова Е.Р.", "note": null, "until": null, "day": 5, "pair": 4, "type": "pr"}, {"guess": true, "week": "even", "subject": "Управление инновационными проектами", "short": "УИП", "room": "1-429", "online": false, "teacher": "Орлова Е.Р.", "note": null, "until": null, "day": 5, "pair": 5, "type": "pr"}], "profile": "Управление инновационными проектами в цифровой экономике"}};
const TIMES=[["9:00","10:30"],["10:40","12:10"],["12:50","14:20"],["14:30","16:00"],["16:10","17:40"],["17:50","19:20"]];
const START=Date.UTC(2026,8,1), END=Date.UTC(2026,11,29), WEEK0=Date.UTC(2026,7,31);
const DAY=864e5;
const MONTHS=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MONTHS_G=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const DN=["пн","вт","ср","чт","пт","сб","вс"];
const DN_FULL=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const now=new Date();
const TODAY=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());

let state={group:store.get("grp"),course:+(store.get("course")||1),sel:Math.min(Math.max(TODAY,START),END),mode:"day"};
if(state.group && !DATA[state.group]) state.group=null;
if(new Date(state.sel).getUTCDay()===0) state.sel+=DAY;

const $=id=>document.getElementById(id);
const dow=t=>(new Date(t).getUTCDay()+6)%7;
const monday=t=>t-dow(t)*DAY;
const weekNo=t=>Math.floor((t-WEEK0)/DAY/7)+1;
const iso=t=>new Date(t).toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function lessonsOn(t){
  if(!state.group||t<START||t>END) return [];
  const d=dow(t); if(d>5) return [];
  const odd=weekNo(t)%2===1, day=iso(t);
  return DATA[state.group].lessons.filter(l=>l.day===d &&
    (l.week==="all"||(l.week==="odd")===odd) && (!l.until||day<=l.until));
}

function lessonHTML(l){
  const meta=[];
  if(l.week!=="all") meta.push(l.week==="odd"?"по нечётным неделям":"по чётным неделям");
  if(l.note) meta.push(esc(l.note));
  const place=l.room?`Кабинет: <b>${esc(l.room)}</b>`:(l.online?"Дистанционно (ДОТ)":"");
  const lec=l.type==="lec";
  return `<div class="lesson"><div class="lhead"><div class="subj">${esc(l.subject)}${l.short?` <span class="abbr">(${esc(l.short)})</span>`:""}</div>
    <span class="tag ${lec?"l":"p"}">${lec?"лек":"пр"}</span></div>
    ${place?`<div class="room-line">${place}</div>`:""}
    ${l.teacher?`<div class="teacher">${esc(l.teacher)}</div>`:""}
    ${meta.length?`<div class="meta">${meta.join(", ")}</div>`:""}</div>`;
}

function slotHTML(p,ls,showEmpty){
  const [a,b]=TIMES[p-1];
  if(!ls.length) return showEmpty?`<div class="slot empty"><div class="time">${a}<br>${b}</div><div class="dash"><i></i><i></i></div></div>`:"";
  return `<div class="slot"><div class="time">${a}<br>${b}</div><div>${ls.map(lessonHTML).join("")}</div></div>`;
}

function dayHTML(t,showEmpty){
  const ls=lessonsOn(t);
  if(dow(t)===6) return `<div class="notice"><b>Воскресенье</b>Занятий нет</div>`;
  if(!ls.length && !showEmpty) return "";
  let h="";
  for(let p=1;p<=6;p++) h+=slotHTML(p,ls.filter(l=>l.pair===p),showEmpty);
  if(!ls.length) h=`<div class="notice"><b>Свободный день</b>Пар нет</div>`;
  return h;
}

function render(){
  $("groupName").textContent=state.group||"Выберите группу";
  $("groupCourse").textContent=state.group?`${DATA[state.group].course} курс магистратуры`:"магистратура ИСАУ";
  const mon=monday(state.sel), d=new Date(state.sel);
  $("monthLbl").textContent=`${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()} г.`;
  const w=weekNo(state.sel);
  $("weekLbl").textContent=`выбрана ${w} неделя, ${w%2?"нечётная":"чётная"}`;
  $("modeBtn").textContent=state.mode==="day"?"Неделя":"День";
  $("prev").disabled = state.mode==="day" ? prevDay(state.sel)===null : mon<=START;
  $("next").disabled = state.mode==="day" ? nextDay(state.sel)===null : mon+7*DAY>END;

  let s="";
  for(let i=0;i<7;i++){
    const t=mon+i*DAY, off=t<START||t>END||i===6;
    const ls=lessonsOn(t);
    const dots=ls.slice(0,6).map(l=>`<i class="${l.type==="lec"?"l":""}"></i>`).join("");
    const cls=["day",off?"off":"",t===TODAY?"today":"",(state.mode==="day"&&t===state.sel)?"sel":""].join(" ");
    s+=`<div><div class="dn">${DN[i]}</div><button class="${cls}" data-t="${t}" ${off?"disabled":""} aria-label="${new Date(t).getUTCDate()} ${MONTHS_G[new Date(t).getUTCMonth()]}"><span class="num">${new Date(t).getUTCDate()}</span><span class="dots">${dots}</span></button></div>`;
  }
  $("strip").innerHTML=s;

  const box=$("slots");
  if(!state.group){box.innerHTML=`<div class="notice"><b>Группа не выбрана</b>Нажмите на кнопку справа вверху, чтобы найти свою группу</div>`;return;}
  if(state.mode==="day"){
    box.innerHTML=dayHTML(state.sel,true);
  }else{
    let h="";
    for(let i=0;i<6;i++){
      const t=mon+i*DAY; if(t<START||t>END) continue;
      const dt=new Date(t), body=dayHTML(t,false);
      h+=`<div class="weekday-h">${DN_FULL[i]}<span>${dt.getUTCDate()} ${MONTHS_G[dt.getUTCMonth()]}</span></div>`+(body||`<div class="slot empty"><div class="time">—</div><div>Пар нет</div></div>`);
    }
    box.innerHTML=h;
  }
}

function nextDay(t){let n=t+DAY;if(dow(n)===6)n+=DAY;return n>END?null:n}
function prevDay(t){let n=t-DAY;if(dow(n)===6)n-=DAY;return n<START?null:n}
function step(dir){
  if(state.mode==="day"){const n=dir>0?nextDay(state.sel):prevDay(state.sel);if(n!==null)state.sel=n;}
  else{let n=monday(state.sel)+dir*7*DAY;n=Math.min(Math.max(n,START),END);state.sel=n;}
  render();
}
$("prev").onclick=()=>step(-1);
$("next").onclick=()=>step(1);
$("modeBtn").onclick=()=>{state.mode=state.mode==="day"?"week":"day";render();};
$("strip").onclick=e=>{const b=e.target.closest(".day");if(!b||b.disabled)return;state.sel=+b.dataset.t;state.mode="day";render();};
let tx=null;
$("slots").addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
$("slots").addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)step(dx<0?1:-1);tx=null;});

/* ---- выбор группы ---- */
let pick=null, act=-1, sheetCourse=state.course;
const norm=s=>s.toLowerCase().replace(/ё/g,"е").replace(/[()\s]+/g," ").trim();
function groupsOf(c){return Object.keys(DATA).filter(g=>DATA[g].course===c)}
function matches(){
  const q=norm($("q").value);
  const all=groupsOf(sheetCourse);
  if(!q) return all;
  const parts=q.split(" ");
  return all.filter(g=>{const n=norm(g+" "+(DATA[g].profile||""));return parts.every(p=>n.includes(p))});
}
function hl(g){
  const q=norm($("q").value); if(!q) return esc(g);
  let out=esc(g);
  q.split(" ").filter(Boolean).forEach(p=>{
    const re=new RegExp("("+p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
    out=out.replace(re,"<mark>$1</mark>");
  });
  return out;
}
function drawList(){
  const m=matches();
  const other=Object.keys(DATA).filter(g=>DATA[g].course!==sheetCourse&&$("q").value.trim()&&norm(g).includes(norm($("q").value)));
  let h=m.map((g,i)=>`<li role="option" data-g="${esc(g)}" class="${i===act?"act":""}" aria-selected="${g===pick}"><div>${hl(g)}${DATA[g].profile?`<small>${esc(DATA[g].profile)}</small>`:""}</div><span>${DATA[g].course} курс</span></li>`).join("");
  if(!m.length) h=`<li class="none">На ${sheetCourse} курсе такой группы нет${other.length?` — есть на ${DATA[other[0]].course} курсе`:""}</li>`;
  $("list").innerHTML=h;
  const exact=m.find(g=>norm(g)===norm($("q").value))||(m.length===1?m[0]:null);
  pick=exact||(pick&&m.includes(pick)?pick:null);
  $("go").disabled=!pick;
  $("err").textContent="";
}
function setCourse(c){
  sheetCourse=c;
  document.querySelectorAll("#courseSeg button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.c===c));
  act=-1;drawList();
}
function openSheet(){
  sheetCourse=state.group?DATA[state.group].course:state.course;
  $("q").value=state.group||"";pick=state.group;setCourse(sheetCourse);
  $("sheetBg").classList.add("open");setTimeout(()=>$("q").select(),50);
}
function closeSheet(){$("sheetBg").classList.remove("open")}
function choose(g){
  if(!g){$("err").textContent="Выберите группу из списка или уточните запрос";return}
  state.group=g;state.course=DATA[g].course;
  store.set("grp",g);store.set("course",state.course);
  closeSheet();render();
}
$("groupBtn").onclick=openSheet;
$("courseSeg").onclick=e=>{const b=e.target.closest("button");if(b)setCourse(+b.dataset.c)};
$("q").oninput=()=>{act=-1;drawList()};
$("chev").onclick=()=>{$("q").value="";act=-1;drawList();$("q").focus()};
$("list").onclick=e=>{const li=e.target.closest("li[data-g]");if(li){$("q").value=li.dataset.g;pick=li.dataset.g;choose(pick)}};
$("q").onkeydown=e=>{
  const m=matches();
  if(e.key==="ArrowDown"){act=Math.min(act+1,m.length-1);e.preventDefault();drawList()}
  else if(e.key==="ArrowUp"){act=Math.max(act-1,0);e.preventDefault();drawList()}
  else if(e.key==="Enter"){choose(act>=0?m[act]:pick)}
  else if(e.key==="Escape"&&state.group){closeSheet()}
};
$("go").onclick=()=>choose(pick);
$("sheetBg").onclick=e=>{if(e.target===$("sheetBg")&&state.group)closeSheet()};

render();
if(!state.group) openSheet();
</script>
